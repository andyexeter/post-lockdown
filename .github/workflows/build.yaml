name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  run:
    runs-on: 'ubuntu-24.04'
    strategy:
      matrix:
        php-versions: [ '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Declare variables
        id: vars
        run: echo "composer_cache_dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          tools: cs2pr
          coverage: none

      - name: Lint PHP
        run: find -L src -type f -name '*.php' -print0 | xargs -0 -n 1 -P $(nproc) php -l

      - name: Cache composer
        uses: actions/cache@v6
        if: matrix.php-versions == 8.3
        with:
          path: ${{ steps.vars.outputs.composer_cache_dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction
        if: matrix.php-versions == 8.3

      - name: PHP-CS-Fixer - Validate coding standards
        run: php vendor/bin/php-cs-fixer fix -vvv --dry-run --using-cache=no --format=checkstyle | cs2pr
        if: matrix.php-versions == 8.3

  # Aggregate gate with a stable name for branch protection to require,
  # so the matrix can change without updating the required-check config.
  ci-success:
    name: Build Success
    if: always()
    needs: run
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if any matrix job failed
        if: needs.run.result != 'success'
        run: |
          echo "run matrix result: ${{ needs.run.result }}"
          exit 1
